<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e; color: #cccccc;
      display: flex; min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px; background: #181818; border-right: 1px solid #333;
      display: flex; flex-direction: column; shrink: 0;
    }
    .sidebar-logo {
      padding: 16px 16px 12px; font-size: 14px; font-weight: 600;
      color: #4fc1ff; border-bottom: 1px solid #333; letter-spacing: 0.5px;
    }
    .sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
    .nav-section { padding: 12px 16px 4px; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1.5px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; font-size: 13px; color: #aaa;
      cursor: pointer; text-decoration: none; transition: background 0.1s;
    }
    .nav-item:hover { background: #2a2a2a; color: #ccc; }
    .nav-item.active { background: #37373d; color: #fff; border-left: 2px solid #4fc1ff; padding-left: 14px; }
    .nav-icon { width: 16px; text-align: center; font-size: 14px; opacity: 0.7; }

    /* Main content */
    .main { flex: 1; overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* Home page */
    .home-content {
      max-width: 480px; margin: 0 auto; padding: 40px 24px;
    }
    .card {
      background: #252526; border: 1px solid #3c3c3c; border-radius: 8px;
      padding: 24px; margin-bottom: 16px;
    }
    .card h2 { font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #333;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #999; font-size: 13px; }
    .info-value { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 15px; letter-spacing: 2px; }
    .info-value.id { color: #4fc1ff; font-size: 18px; font-weight: 600; }
    .info-value.password { color: #ce9178; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: #73c991; }
    .status-dot.offline { background: #c74e39; }
    .status-dot.connecting { background: #e2c08d; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
    .form-group input {
      width: 100%; padding: 8px 12px; background: #3c3c3c; border: 1px solid #555;
      border-radius: 4px; color: #ccc; font-size: 14px; outline: none;
      font-family: 'Cascadia Code', 'Fira Code', monospace; letter-spacing: 1px;
    }
    .form-group input:focus { border-color: #007acc; }
    .form-group input::placeholder { color: #666; letter-spacing: 0; font-family: inherit; }
    .btn {
      width: 100%; padding: 10px; background: #0e639c; border: none; border-radius: 4px;
      color: white; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn:hover { background: #1177bb; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .error { color: #f44747; font-size: 12px; margin-top: 8px; }
    .success { color: #73c991; font-size: 12px; margin-top: 8px; }
    .settings-toggle {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .settings-toggle .arrow { transition: transform 0.2s; font-size: 10px; color: #666; }
    .settings-toggle .arrow.open { transform: rotate(90deg); }
    .settings-body { display: none; margin-top: 12px; }
    .settings-body.open { display: block; }
    .form-group input.setting-input {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px; letter-spacing: 0.5px;
    }
    .btn-secondary {
      width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid #555;
      border-radius: 4px; color: #ccc; font-size: 13px; cursor: pointer;
    }
    .btn-secondary:hover { background: #4a4a4a; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-icon {
      background: #3c3c3c; border: 1px solid #555; border-radius: 4px;
      color: #ccc; font-size: 16px; width: 28px; height: 28px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .btn-icon:hover { background: #4a4a4a; color: #fff; }
    .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
    .restart-note { font-size: 11px; color: #e2c08d; margin-top: 8px; }

    /* Docs page */
    .docs-content {
      max-width: 760px; margin: 0 auto; padding: 40px 32px;
    }
    .docs-content h1 {
      font-size: 28px; color: #e2e2e2; margin-bottom: 8px; font-weight: 600;
      border-bottom: 1px solid #333; padding-bottom: 12px;
    }
    .docs-content h2 {
      font-size: 20px; color: #ddd; margin-top: 32px; margin-bottom: 12px;
      font-weight: 600;
    }
    .docs-content h3 {
      font-size: 16px; color: #ccc; margin-top: 24px; margin-bottom: 8px;
      font-weight: 600;
    }
    .docs-content p {
      font-size: 14px; line-height: 1.7; margin-bottom: 12px; color: #bbb;
    }
    .docs-content ul, .docs-content ol {
      margin: 8px 0 12px 24px; font-size: 14px; line-height: 1.7; color: #bbb;
    }
    .docs-content li { margin-bottom: 4px; }
    .docs-content code {
      background: #2d2d2d; border: 1px solid #404040; border-radius: 3px;
      padding: 1px 5px; font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 13px; color: #ce9178;
    }
    .docs-content pre {
      background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
      padding: 16px; margin: 12px 0; overflow-x: auto;
    }
    .docs-content pre code {
      background: none; border: none; padding: 0; color: #d4d4d4;
      font-size: 13px; line-height: 1.5;
    }
    .docs-content table {
      width: 100%; border-collapse: collapse; margin: 12px 0;
      font-size: 13px;
    }
    .docs-content th {
      text-align: left; padding: 8px 12px; background: #2a2a2a;
      border: 1px solid #404040; color: #ddd; font-weight: 600;
    }
    .docs-content td {
      padding: 8px 12px; border: 1px solid #333; color: #bbb;
    }
    .docs-content blockquote {
      border-left: 3px solid #4fc1ff; margin: 12px 0; padding: 8px 16px;
      background: #1a2332; border-radius: 0 4px 4px 0;
      font-size: 13px; color: #aac8e4;
    }
    .docs-content blockquote p { margin-bottom: 0; color: inherit; }
    .docs-content strong { color: #e2e2e2; }
    .docs-content a { color: #4fc1ff; text-decoration: none; }
    .docs-content a:hover { text-decoration: underline; }
    .docs-content hr { border: none; border-top: 1px solid #333; margin: 24px 0; }

    .docs-loading {
      padding: 60px; text-align: center; color: #666; font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 180px; }
      .docs-content { padding: 24px 16px; }
      .home-content { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">VS Code Remote</div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <a class="nav-item active" data-page="home" onclick="navigate('home')">
        <span class="nav-icon">⌂</span> Home
      </a>

      <div class="nav-section">Documentation</div>
      <div id="docsNav"></div>
    </nav>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Home Page -->
    <div class="page active" id="page-home">
      <div class="home-content">
        <!-- This Device -->
        <div class="card">
          <h2>This Device</h2>
          <div class="info-row">
            <span class="info-label">Machine ID</span>
            <span class="info-value id" id="machineId">---</span>
          </div>
          <div class="info-row">
            <span class="info-label">Password</span>
            <span style="display:flex;align-items:center;gap:8px">
              <span class="info-value password" id="password">---</span>
              <button onclick="regeneratePassword()" id="regenBtn" class="btn-icon" title="Regenerate password">&#x21bb;</button>
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">Relay</span>
            <span class="status">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusText">Checking...</span>
            </span>
          </div>
        </div>

        <!-- Connect to Remote -->
        <div class="card">
          <h2>Connect to Remote</h2>
          <div class="form-group">
            <label>Remote Machine ID</label>
            <input type="text" id="remoteId" placeholder="000-000-000" maxlength="11" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="remotePassword" placeholder="Enter password" />
          </div>
          <button class="btn" id="connectBtn" onclick="connectRemote()" disabled>Connect</button>
          <div class="error" id="error"></div>
        </div>

        <!-- Settings -->
        <div class="card">
          <div class="settings-toggle" onclick="toggleSettings()">
            <h2 style="margin-bottom:0">Settings</h2>
            <span class="arrow" id="settingsArrow">&#9654;</span>
          </div>
          <div class="settings-body" id="settingsBody">
            <div class="form-group">
              <label>Relay URL</label>
              <input type="text" id="settingRelayUrl" class="setting-input" placeholder="ws://..." />
            </div>
            <button class="btn-secondary" id="saveSettingsBtn" onclick="saveSettings()">Save Settings</button>
            <div class="success" id="settingsSaved" style="display:none">Settings saved.</div>
            <div class="error" id="settingsError"></div>
            <div class="success" id="settingsSuccess" style="display:none"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Docs Page -->
    <div class="page" id="page-docs">
      <div class="docs-content" id="docsBody">
        <div class="docs-loading">Select a doc from the sidebar</div>
      </div>
    </div>
  </div>

  <script>
    // ===== Navigation =====
    let currentPage = 'home';
    let docsCache = {};

    function navigate(page, slug) {
      // Update nav
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const target = slug
        ? document.querySelector(`.nav-item[data-slug="${slug}"]`)
        : document.querySelector(`.nav-item[data-page="${page}"]`);
      if (target) target.classList.add('active');

      // Update pages
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(`page-${page}`).classList.add('active');
      currentPage = page;

      if (page === 'docs' && slug) {
        loadDoc(slug);
      }
    }

    // ===== Docs =====
    const docIcons = {
      'getting-started': '🚀',
      'architecture': '🏗',
      'authentication': '🔑',
      'port-forwarding': '🌐',
      'terminal': '⬛',
      'file-system': '📁',
      'claude-code': '🤖',
    };

    async function loadDocsNav() {
      try {
        const res = await fetch('/api/docs');
        const docs = await res.json();
        const nav = document.getElementById('docsNav');
        nav.innerHTML = docs.map(d =>
          `<a class="nav-item" data-page="docs" data-slug="${d.slug}" onclick="navigate('docs','${d.slug}')">
            <span class="nav-icon">${docIcons[d.slug] || '📄'}</span> ${d.title}
          </a>`
        ).join('');
      } catch {
        // ignore
      }
    }

    async function loadDoc(slug) {
      const body = document.getElementById('docsBody');

      if (docsCache[slug]) {
        body.innerHTML = docsCache[slug];
        return;
      }

      body.innerHTML = '<div class="docs-loading">Loading...</div>';

      try {
        const res = await fetch(`/api/docs/${slug}`);
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        const html = renderMarkdown(md);
        docsCache[slug] = html;
        body.innerHTML = html;
      } catch {
        body.innerHTML = '<div class="docs-loading">Failed to load documentation</div>';
      }
    }

    // ===== Simple Markdown Renderer =====
    function renderMarkdown(md) {
      let html = '';
      const lines = md.split('\n');
      let i = 0;
      let inCodeBlock = false;
      let codeContent = '';
      let inTable = false;
      let tableRows = [];
      let inList = false;
      let listItems = [];
      let listOrdered = false;
      let inBlockquote = false;
      let bqContent = [];

      function flushList() {
        if (!inList) return;
        const tag = listOrdered ? 'ol' : 'ul';
        html += `<${tag}>${listItems.map(l => `<li>${inlineFormat(l)}</li>`).join('')}</${tag}>`;
        listItems = [];
        inList = false;
      }

      function flushTable() {
        if (!inTable) return;
        let t = '<table>';
        tableRows.forEach((row, idx) => {
          if (row.trim().startsWith('|') && row.includes('---')) return; // separator
          const cells = row.split('|').filter(c => c.trim() !== '');
          const tag = idx === 0 ? 'th' : 'td';
          t += '<tr>' + cells.map(c => `<${tag}>${inlineFormat(c.trim())}</${tag}>`).join('') + '</tr>';
        });
        t += '</table>';
        html += t;
        tableRows = [];
        inTable = false;
      }

      function flushBlockquote() {
        if (!inBlockquote) return;
        html += `<blockquote><p>${inlineFormat(bqContent.join(' '))}</p></blockquote>`;
        bqContent = [];
        inBlockquote = false;
      }

      function inlineFormat(text) {
        return text
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      }

      while (i < lines.length) {
        const line = lines[i];

        // Code block
        if (line.startsWith('```')) {
          if (inCodeBlock) {
            html += `<pre><code>${codeContent.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
            codeContent = '';
            inCodeBlock = false;
          } else {
            flushList(); flushTable(); flushBlockquote();
            inCodeBlock = true;
          }
          i++;
          continue;
        }
        if (inCodeBlock) {
          codeContent += (codeContent ? '\n' : '') + line;
          i++;
          continue;
        }

        // Table
        if (line.trim().startsWith('|')) {
          flushList(); flushBlockquote();
          if (!inTable) inTable = true;
          tableRows.push(line);
          i++;
          continue;
        } else {
          flushTable();
        }

        // Blockquote
        if (line.startsWith('> ')) {
          flushList(); flushTable();
          if (!inBlockquote) inBlockquote = true;
          bqContent.push(line.slice(2));
          i++;
          continue;
        } else {
          flushBlockquote();
        }

        // List
        const ulMatch = line.match(/^- (.+)/);
        const olMatch = line.match(/^\d+\. (.+)/);
        if (ulMatch || olMatch) {
          flushTable(); flushBlockquote();
          const content = ulMatch ? ulMatch[1] : olMatch[1];
          const isOl = !!olMatch;
          if (inList && listOrdered !== isOl) flushList();
          inList = true;
          listOrdered = isOl;
          listItems.push(content);
          i++;
          continue;
        } else {
          flushList();
        }

        // Empty line
        if (!line.trim()) { i++; continue; }

        // Headings
        if (line.startsWith('### ')) { html += `<h3>${inlineFormat(line.slice(4))}</h3>`; i++; continue; }
        if (line.startsWith('## ')) { html += `<h2>${inlineFormat(line.slice(3))}</h2>`; i++; continue; }
        if (line.startsWith('# ')) { html += `<h1>${inlineFormat(line.slice(2))}</h1>`; i++; continue; }

        // Horizontal rule
        if (line.match(/^---+$/)) { html += '<hr>'; i++; continue; }

        // Paragraph
        html += `<p>${inlineFormat(line)}</p>`;
        i++;
      }

      flushList(); flushTable(); flushBlockquote();
      return html;
    }

    // ===== Home Page Logic =====
    document.getElementById('remoteId').addEventListener('input', function(e) {
      let val = e.target.value.replace(/[^0-9]/g, '').slice(0, 9);
      if (val.length > 6) val = val.slice(0,3) + '-' + val.slice(3,6) + '-' + val.slice(6);
      else if (val.length > 3) val = val.slice(0,3) + '-' + val.slice(3);
      e.target.value = val;
    });

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const mid = data.machineId;
        document.getElementById('machineId').textContent =
          mid.slice(0,3) + '-' + mid.slice(3,6) + '-' + mid.slice(6);
        document.getElementById('password').textContent = data.password || '(fixed password set)';
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        if (data.relayConnected) {
          dot.className = 'status-dot online';
          text.textContent = 'Connected';
          connectBtn.disabled = false;
        } else {
          dot.className = 'status-dot connecting';
          text.textContent = 'Connecting...';
          connectBtn.disabled = true;
        }
      } catch {
        document.getElementById('statusDot').className = 'status-dot offline';
        document.getElementById('statusText').textContent = 'Error';
        document.getElementById('connectBtn').disabled = true;
      }
    }

    async function connectRemote() {
      const machineId = document.getElementById('remoteId').value.replace(/-/g, '');
      const password = document.getElementById('remotePassword').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      if (machineId.length !== 9) {
        errorEl.textContent = 'Please enter a valid 9-digit Machine ID';
        return;
      }
      if (!password) {
        errorEl.textContent = 'Please enter the password';
        return;
      }

      const btn = document.getElementById('connectBtn');
      btn.disabled = true;
      btn.textContent = 'Connecting...';

      try {
        const connectRes = await fetch('/api/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ machineId }),
        });
        const connectData = await connectRes.json();
        if (!connectData.editorUrl) {
          errorEl.textContent = connectData.error || 'Failed to connect';
          return;
        }

        const relayBase = connectData.editorUrl.replace(/\/editor\/.*$/, '');
        const loginRes = await fetch(`${relayBase}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ machineId, password }),
        });

        if (!loginRes.ok) {
          const loginData = await loginRes.json();
          errorEl.textContent = loginData.error || 'Authentication failed';
          return;
        }

        const { token } = await loginRes.json();
        const url = new URL(connectData.editorUrl);
        url.searchParams.set('token', token);
        window.open(url.toString(), '_blank');
      } catch (err) {
        errorEl.textContent = 'Connection failed';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }

    document.getElementById('remotePassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') connectRemote();
    });

    // ===== Regenerate Password =====
    async function regeneratePassword() {
      const btn = document.getElementById('regenBtn');
      if (!confirm('Generate a new password? The old one will stop working.')) return;
      btn.disabled = true;
      try {
        const res = await fetch('/api/password/regenerate', { method: 'POST' });
        const data = await res.json();
        if (data.password) {
          document.getElementById('password').textContent = data.password;
        }
      } catch {
        // ignore
      } finally {
        btn.disabled = false;
      }
    }

    // ===== Settings =====
    function toggleSettings() {
      const body = document.getElementById('settingsBody');
      const arrow = document.getElementById('settingsArrow');
      const isOpen = body.classList.toggle('open');
      arrow.classList.toggle('open', isOpen);
      if (isOpen) fetchSettings();
    }

    async function fetchSettings() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        document.getElementById('settingRelayUrl').value = data.relayUrl || '';
      } catch {
        // ignore
      }
    }

    async function saveSettings() {
      const relayUrl = document.getElementById('settingRelayUrl').value.trim();
      const errorEl = document.getElementById('settingsError');
      const savedEl = document.getElementById('settingsSaved');
      errorEl.textContent = '';
      savedEl.style.display = 'none';

      const btn = document.getElementById('saveSettingsBtn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ relayUrl }),
        });
        const data = await res.json();
        if (data.success) {
          savedEl.style.display = 'block';
          setTimeout(() => { savedEl.style.display = 'none'; }, 3000);
        } else {
          errorEl.textContent = data.error || 'Failed to save';
        }
      } catch {
        errorEl.textContent = 'Failed to save settings';
      } finally {
        btn.disabled = false;
      }
    }

    // ===== Init =====
    fetchStatus();
    setInterval(fetchStatus, 3000);
    loadDocsNav();
  </script>
</body>
</html>
