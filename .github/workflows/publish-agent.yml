name: Publish Agent to npm

on:
  push:
    tags:
      - 'agent@*'  # trigger on tags like agent@0.4.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.4.0). Leave empty to use package.json version.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @vscode-remote/shared build

      - name: Bump version (if specified)
        if: inputs.version
        working-directory: agent
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build agent (bake env vars)
        run: pnpm --filter @hanoilab/opencode build
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Publish to npm
        working-directory: agent
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
