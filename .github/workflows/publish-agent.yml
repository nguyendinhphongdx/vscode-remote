name: Publish Agent to npm

on:
  push:
    tags:
      - 'agent@*'  # trigger on tags like agent@0.4.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.4.0). Leave empty to use package.json version.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @vscode-remote/shared build

      - name: Bump version (if specified)
        if: inputs.version
        working-directory: agent
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Debug — verify secrets are accessible
        run: |
          echo "RELAY_URL set:    $([ -n "$RELAY_URL" ] && echo yes || echo no)"
          echo "RELAY_URL length: ${#RELAY_URL}"
          echo "RELAY_SECRET set:    $([ -n "$RELAY_SECRET" ] && echo yes || echo no)"
          echo "RELAY_SECRET length: ${#RELAY_SECRET}"
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Generate build constants from secrets
        working-directory: agent
        run: |
          node -e "const fs=require('fs');const url=process.env.RELAY_URL||'';const secret=process.env.RELAY_SECRET||'';fs.writeFileSync('src/buildConstants.generated.ts',\`// AUTO-GENERATED — do not edit.\nexport const BUILD_RELAY_URL = \${JSON.stringify(url)};\nexport const BUILD_RELAY_SECRET = \${JSON.stringify(secret)};\n\`);console.log('Generated buildConstants.generated.ts (URL='+url.length+' chars, SECRET='+secret.length+' chars)');"
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Build agent
        working-directory: agent
        run: pnpm build

      - name: Publish to npm
        working-directory: agent
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
