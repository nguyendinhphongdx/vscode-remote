name: Publish Agent to npm

on:
  push:
    tags:
      - 'agent@*'  # trigger on tags like agent@0.4.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.4.0). Leave empty to use package.json version.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @vscode-remote/shared build

      - name: Bump version (if specified)
        if: inputs.version
        working-directory: agent
        run: npm version ${{ inputs.version }} --no-git-tag-version

      # No RELAY_URL/RELAY_SECRET here on purpose — this package is a public,
      # self-hostable tool (anyone runs their own relay). Baking a real
      # secret into a publicly downloadable npm package would ship it in
      # plaintext (dist/index.js) to everyone who installs it, and it's
      # useless to someone hosting their own relay anyway. Every user must
      # run `opencode setup` (or set RELAY_URL/RELAY_SECRET env vars)
      # against their own relay instance.
      - name: Build agent
        working-directory: agent
        run: pnpm build

      - name: Publish to npm
        working-directory: agent
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
